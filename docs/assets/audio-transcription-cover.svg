<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Audio Transcription Skill</title>
  <desc id="desc">A visual cover showing audio, transcription, subtitles, package output, and quality checks.</desc>
  <defs>
