<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Audio Transcription Skill</title>
  <desc id="desc">A clean cover for a Codex skill that turns audio and video into transcripts, subtitles, summaries, and delivery packages.</desc>
  <defs>
    <linearGradient id="leftPanel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#15343d"/>
      <stop offset="100%" stop-color="#245957"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#2db6a3"/>
      <stop offset="100%" stop-color="#f2b84b"/>
    </linearGradient>
    <filter id="softShadow" x="-12%" y="-18%" width="124%" height="136%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0f2430" flood-opacity="0.14"/>
    </filter>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .eyebrow { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
      .title { font-size: 70px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-size: 25px; font-weight: 500; letter-spacing: 0; }
      .cardTitle { font-size: 28px; font-weight: 800; letter-spacing: 0; }
      .cardText { font-size: 20px; font-weight: 500; letter-spacing: 0; }
      .chip { font-size: 17px; font-weight: 700; letter-spacing: 0; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="#f6f8f4"/>
  <path d="M0 560 C210 500 345 620 560 552 S910 466 1280 546" fill="none" stroke="#d8e2d9" stroke-width="3"/>
  <path d="M682 70 C814 32 1018 52 1196 122" fill="none" stroke="#e1d9bd" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <path d="M710 100 C850 70 1020 90 1190 150" fill="none" stroke="#c6e4df" stroke-width="8" stroke-linecap="round" opacity="0.8"/>

  <g class="ui" transform="translate(64 64)">
    <rect x="0" y="0" width="500" height="512" rx="34" fill="url(#leftPanel)" filter="url(#softShadow)"/>
    <text x="48" y="70" fill="#b8ece4" class="eyebrow">AUDIO TRANSCRIPTION SKILL</text>
    <text x="48" y="156" fill="#f8fffd" class="title">音视频转录</text>
    <text x="48" y="238" fill="#f8fffd" class="title">工作流</text>
    <text x="50" y="300" fill="#d5ece9" class="subtitle">面向 Codex 的本地 Whisper</text>
    <text x="50" y="336" fill="#d5ece9" class="subtitle">字幕校验、翻译与交付打包</text>

    <g transform="translate(48 386)">
      <rect x="0" y="0" width="112" height="40" rx="20" fill="#e9fbf7" opacity="0.96"/>
      <rect x="128" y="0" width="116" height="40" rx="20" fill="#fff2c8" opacity="0.96"/>
      <rect x="260" y="0" width="96" height="40" rx="20" fill="#e9fbf7" opacity="0.96"/>
      <text x="26" y="26" fill="#17343d" class="chip">Bilibili</text>
      <text x="154" y="26" fill="#17343d" class="chip">Podcast</text>
      <text x="286" y="26" fill="#17343d" class="chip">Local</text>
    </g>
    <g transform="translate(48 444)">
      <rect x="0" y="0" width="144" height="40" rx="20" fill="#ffffff" opacity="0.12"/>
      <rect x="160" y="0" width="132" height="40" rx="20" fill="#ffffff" opacity="0.12"/>
      <rect x="308" y="0" width="104" height="40" rx="20" fill="#ffffff" opacity="0.12"/>
      <text x="24" y="26" fill="#e9fbf7" class="chip">large-v3-mlx</text>
      <text x="186" y="26" fill="#e9fbf7" class="chip">SRT / VTT</text>
      <text x="338" y="26" fill="#e9fbf7" class="chip">ZIP</text>
    </g>
  </g>

  <g class="ui" transform="translate(620 84)">
    <text x="0" y="34" fill="#183842" font-size="34" font-weight="800">从输入到交付，一条命令唤起</text>
    <text x="0" y="72" fill="#577079" font-size="22" font-weight="500">下载、验证、转录、修复、总结、打包都有脚本兜底。</text>

    <g transform="translate(0 116)" filter="url(#softShadow)">
      <rect x="0" y="0" width="560" height="94" rx="18" fill="#ffffff"/>
      <rect x="28" y="26" width="42" height="42" rx="12" fill="#dff6f2"/>
      <path d="M36 48 Q43 31 50 48 T64 48" fill="none" stroke="#1b6f67" stroke-width="5" stroke-linecap="round"/>
      <text x="92" y="39" fill="#15343d" class="cardTitle">1. 输入源</text>
      <text x="92" y="70" fill="#5e737a" class="cardText">B站视频、小宇宙播客、本地音视频、已有逐字稿</text>
    </g>

    <g transform="translate(0 238)" filter="url(#softShadow)">
      <rect x="0" y="0" width="560" height="94" rx="18" fill="#ffffff"/>
      <rect x="28" y="24" width="42" height="46" rx="10" fill="#fff1c1"/>
      <rect x="40" y="36" width="18" height="4" rx="2" fill="#9b6c00"/>
      <rect x="40" y="48" width="24" height="4" rx="2" fill="#9b6c00"/>
      <rect x="40" y="60" width="14" height="4" rx="2" fill="#9b6c00"/>
      <text x="92" y="39" fill="#15343d" class="cardTitle">2. 转录与校验</text>
      <text x="92" y="70" fill="#5e737a" class="cardText">默认 large-v3-mlx，优先检查可用字幕源</text>
    </g>

    <g transform="translate(0 360)" filter="url(#softShadow)">
      <rect x="0" y="0" width="560" height="94" rx="18" fill="#ffffff"/>
      <rect x="28" y="26" width="42" height="42" rx="12" fill="#dff6f2"/>
      <path d="M39 40 H59 M39 50 H59 M39 60 H53" stroke="#1b6f67" stroke-width="5" stroke-linecap="round"/>
      <text x="92" y="39" fill="#15343d" class="cardTitle">3. 交付物</text>
      <text x="92" y="70" fill="#5e737a" class="cardText">Markdown、TXT、SRT、VTT、JSON、ZIP 和报告</text>
    </g>

    <g transform="translate(0 474)">
      <rect x="0" y="0" width="560" height="72" rx="18" fill="#17343d"/>
      <rect x="0" y="0" width="560" height="6" rx="3" fill="url(#accent)"/>
      <text x="28" y="32" fill="#eafffb" font-size="20" font-weight="700">$audio-transcription 转录这个视频</text>
      <text x="28" y="58" fill="#b8ece4" font-size="18" font-weight="600">输出逐字稿、字幕、总结和论点论据</text>
    </g>
  </g>
</svg>
